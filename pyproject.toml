[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain-text-splitters",
    "langgraph",
    "langchain-openai",
    "langchain-google-genai",
    "langchain-mistralai",
    "openai",
    "mistralai",
    "langchain-chroma",
    "chromadb",
    "rank_bm25",
    "langchain-huggingface",
    "sentence-transformers",
    "pypdf",
    "beautifulsoup4",
    "lxml",
    "unstructured",
    "tiktoken",
    "python-dotenv",
    "pandas",
    "numpy",
    "fastapi",
    "uvicorn",
    "requests",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
